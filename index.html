<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple MD</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <header id="titlebar" data-tauri-drag-region>
      <span id="file-name" title="Switch file (⌘P)">No file open</span>
      <span id="dirty-dot" hidden>●</span>
      <span id="file-path" title="Switch file (⌘P)"></span>
      <div id="titlebar-actions">
        <button id="btn-reload" title="Reload from disk (⌘R)">↻</button>
        <button id="btn-save" title="Save (⌘S)">Save</button>
        <button id="btn-appearance" title="Appearance">Aa</button>
      </div>
    </header>

    <div id="conflict-bar" hidden>
      <span id="conflict-msg"></span>
      <span class="conflict-actions">
        <button id="conflict-reload">Reload from disk</button>
        <button id="conflict-overwrite">Overwrite with my version</button>
        <button id="conflict-dismiss">Dismiss</button>
      </span>
    </div>

    <div id="appearance-panel" hidden>
      <div class="ap-row">
        <label>Appearance</label>
        <div class="ap-seg" data-pref="appearance">
          <button data-v="auto">Auto</button>
          <button data-v="light">Light</button>
          <button data-v="dark">Dark</button>
        </div>
      </div>
      <div class="ap-row">
        <label>Voice</label>
        <div class="ap-seg" data-pref="voice">
          <button data-v="standard">Standard</button>
          <button data-v="novel">Novel</button>
          <button data-v="paper">Paper</button>
          <button data-v="magazine">Magazine</button>
        </div>
      </div>
      <div class="ap-row">
        <label>Font</label>
        <div class="ap-seg" data-pref="font">
          <button data-v="auto">Auto</button>
          <button data-v="book">Book</button>
          <button data-v="charter">Charter</button>
          <button data-v="newyork">NY</button>
          <button data-v="sans">Sans</button>
          <button data-v="mono">Mono</button>
        </div>
      </div>
      <div class="ap-row">
        <label>Headings</label>
        <div class="ap-seg" data-pref="headings">
          <button data-v="auto">Auto</button>
          <button data-v="book">Book</button>
          <button data-v="charter">Charter</button>
          <button data-v="newyork">NY</button>
          <button data-v="sans">Sans</button>
          <button data-v="mono">Mono</button>
        </div>
      </div>
      <div class="ap-row">
        <label>Width</label>
        <div class="ap-seg" data-pref="width">
          <button data-v="narrow">Narrow</button>
          <button data-v="medium">Medium</button>
          <button data-v="wide">Wide</button>
          <button data-v="full">Full</button>
        </div>
      </div>
      <div class="ap-row">
        <label>Zoom</label>
        <div class="ap-seg" data-pref="zoom">
          <button data-v="0.9">90%</button>
          <button data-v="1">100%</button>
          <button data-v="1.1">110%</button>
          <button data-v="1.25">125%</button>
        </div>
      </div>
      <details id="ap-advanced">
        <summary>Advanced</summary>
        <div class="ap-row">
          <label>Heading case</label>
          <div class="ap-seg" data-pref="headingCase">
            <button data-v="auto">Auto</button>
            <button data-v="normal">Normal</button>
            <button data-v="smallcaps">Small caps</button>
          </div>
        </div>
        <div class="ap-row">
          <label>Heading align</label>
          <div class="ap-seg" data-pref="headingAlign">
            <button data-v="auto">Auto</button>
            <button data-v="left">Left</button>
            <button data-v="center">Center</button>
          </div>
        </div>
        <div class="ap-row">
          <label>Paragraphs</label>
          <div class="ap-seg" data-pref="paragraph">
            <button data-v="flowing">Flowing</button>
            <button data-v="indented">Indented</button>
          </div>
        </div>
        <div class="ap-row">
          <label>Alignment</label>
          <div class="ap-seg" data-pref="justify">
            <button data-v="ragged">Ragged</button>
            <button data-v="justified">Justified</button>
          </div>
        </div>
        <div class="ap-row">
          <label>Density</label>
          <div class="ap-seg" data-pref="density">
            <button data-v="compact">Compact</button>
            <button data-v="standard">Standard</button>
            <button data-v="relaxed">Relaxed</button>
          </div>
        </div>
        <div class="ap-row">
          <label>Break (---)</label>
          <div class="ap-seg" data-pref="sectionBreak">
            <button data-v="auto">Auto</button>
            <button data-v="line">Line</button>
            <button data-v="dinkus">* * *</button>
            <button data-v="fleuron">❦</button>
          </div>
        </div>
        <div class="ap-row">
          <label>Numbers</label>
          <div class="ap-seg" data-pref="headingNumbers">
            <button data-v="auto">Auto</button>
            <button data-v="on">On</button>
            <button data-v="off">Off</button>
          </div>
        </div>
        <div class="ap-row">
          <label>Ornaments</label>
          <div class="ap-seg" data-pref="ornaments">
            <button data-v="auto">Auto</button>
            <button data-v="on">On</button>
            <button data-v="off">Off</button>
          </div>
        </div>
      </details>
    </div>

    <main id="editor-host">
      <div id="editor" lang="en"></div>
      <div id="empty-state">
        <h1>Simple MD</h1>
        <p><kbd>⌘P</kbd> to find a file — paste a path or fuzzy-type a name</p>
      </div>
    </main>

    <footer id="statusbar">
      <span id="index-status">indexing…</span>
      <span id="save-status"></span>
    </footer>

    <div id="palette-overlay" hidden>
      <div id="palette">
        <input
          id="palette-input"
          type="text"
          placeholder="Paste a path or fuzzy-search files…"
          spellcheck="false"
          autocomplete="off"
        />
        <ul id="palette-results"></ul>
      </div>
    </div>
  </body>
</html>
